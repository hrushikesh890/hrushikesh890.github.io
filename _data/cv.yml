        highlights:
          - Quantum information science group of Dr. Sabre Kais.
          - Working on fault-tolerant quantum computing (magic state cultivation, lattice surgery, resource estimation), quantum error correction, and simulation of open and non-equilibrium quantum systems.

      - company: North Carolina State University
        position: Graduate Research Assistant, Quantum Error Mitigation, Correction and Characterization Strategies
        location: Raleigh, NC
        start_date: 2022-03-01
        end_date: 2026-05-01
        highlights:
          - Improved error rate by 88% using reliability-aware error mitigation strategies (Reliability-based Zero Noise Extrapolation).
          - Integrated circuit cutting and knitting techniques with error mitigation to enhance circuit fidelity (presented at QCE 2023).
          - Designed a novel unsupervised-learning-based quantum error mitigation method with machine-learning-based noise characterization, improving fidelity by 1.45x across algorithms (presented at IEEE QCE 2025, code on GitHub).
          - Collaborated on benchmarking fidelity estimation and noise characterization techniques, improving mitigation performance by up to 7.97x (presented at QCE 2025).
          - Combined quantum error mitigation and error correction to enhance fault tolerance, and explored improvements to the magic state cultivation protocol using code-switch protocols.

      - company: SRI
        position: Quantum Benchmarking Intern
        location: Menlo Park, CA
        start_date: 2025-06-01
        end_date: 2025-08-01
        summary: Developed the Quantum Reinforcement Learning benchmark for the QED-C Application Oriented Benchmark suite.
        highlights:
          - Demonstrated the need for co-development of high performance computing (HPC) and quantum computing control systems stacks for hybrid algorithms.
          - Collaborated on methods to benchmark dynamic (mid-circuit measurement) circuits and applications. Pre-print available.

      - company: Los Alamos National Laboratory
        position: Fellowship Student
        location: Los Alamos, NM
        start_date: 2024-06-01
        end_date: 2024-08-01
        highlights:
          - Collaborated on QAOA-based Quantum Linear System Problem warm-start optimizations on JuliQAOA.
          - Reduced runtime of QAOA Quantum Linear System Problem by 33% by instrumenting warm-started global optimization.

      - company: Stony Brook University
        position: Graduate Research Assistant, Effect of Noise on Quantum Linear Solvers
        location: Stony Brook, NY
        start_date: 2020-06-01
        end_date: 2021-05-01
        highlights:
          - Reduced resource use in the Variational Quantum Linear Solver by 67% using dynamic ansatz and noise-aware optimization.
          - Published in Physical Review A; presented at an invited session at INFORMS 2022.

